<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="robots" content="none" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Подсветка латиницы/кириллицы</title>
    <link rel="stylesheet" href="/shared.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>

<body>
    <div class="wrap">
        <header>
            <h1>Редактор с подсветкой: <span style="color:var(--latin)">латиница</span> / <span
                    style="color:var(--cyril)">кириллица</span></h1>
            <div class="hint">Латинские буквы — синим, кириллица — красным. Остальное — обычным цветом.</div>
        </header>

        <div class="toolbar">
            <button id="btnClear" type="button">Очистить</button>
            <button id="btnSample" type="button">Вставить пример</button>
            <button id="btnCopy" type="button">Скопировать текст</button>
            <div class="stats" aria-live="polite">
                <span class="badge"><span class="dot latin"></span>Латиница: <strong id="latinCount">0</strong></span>
                <span class="badge"><span class="dot cyril"></span>Кириллица: <strong id="cyrilCount">0</strong></span>
                <span class="badge">Всего символов: <strong id="totalCount">0</strong></span>
            </div>
        </div>

        <div class="editorShell" role="group" aria-label="Текстовый редактор">
            <pre id="highlight" class="layer" aria-hidden="true"></pre>
            <textarea id="input" class="layer" spellcheck="false" placeholder="Пишите здесь…"
                aria-label="Поле ввода"></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
