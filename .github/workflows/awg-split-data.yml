name: Обновление списков awg-split

on:
  schedule:
    - cron: "17 3 * * 1"   # каждый понедельник, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python awg-split/build_data.py
      - name: Коммит, если списки изменились
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awg-split/data
          git diff --staged --quiet || git commit -m "Refresh awg-split route lists"
          git push
